name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker & D1 Backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Setting up D1 database..."
          DB_ID=""

          # Try creating the D1 database
          CREATE_OUTPUT=$(npx wrangler d1 create shardmail-db 2>&1 || true)
          echo "$CREATE_OUTPUT"

          # Extract UUID from create output
          DB_ID=$(echo "$CREATE_OUTPUT" | grep -o -E '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1 || true)

          # If database already exists or UUID not captured, look up existing ID
          if [ -z "$DB_ID" ]; then
            echo "Database may already exist. Looking up existing database ID via wrangler d1 info / list..."
            INFO_OUTPUT=$(npx wrangler d1 info shardmail-db --json 2>/dev/null || true)
            DB_ID=$(echo "$INFO_OUTPUT" | grep -o -E '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1 || true)
          fi

          if [ -z "$DB_ID" ]; then
            LIST_OUTPUT=$(npx wrangler d1 list --json 2>/dev/null || true)
            DB_ID=$(node -e '
              try {
                const list = JSON.parse(process.argv[1]);
                const db = Array.isArray(list) ? list.find(d => d.name === "shardmail-db") : null;
                if (db && db.uuid) console.log(db.uuid);
              } catch (e) {}
            ' "$LIST_OUTPUT" 2>/dev/null || true)
          fi

          if [ -n "$DB_ID" ]; then
            echo "Successfully resolved D1 Database ID: $DB_ID"
            sed -i -E "s/database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml
            echo "Updated wrangler.toml:"
            grep "database_id" wrangler.toml
          else
            echo "::error::Could not find or create D1 database ID for shardmail-db"
            exit 1
          fi

          echo "Applying remote database migrations..."
          npx wrangler d1 migrations apply shardmail-db --remote

          # Attempt to commit updated wrangler.toml back to repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: auto-update D1 database_id in wrangler.toml [skip ci]"
            git push || echo "Note: could not push updated wrangler.toml to repository; run will continue using updated local file."
          fi

      - name: Configure Admin Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN
          else
            echo "::warning::ADMIN_TOKEN secret not set in repository settings"
          fi

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOY_OUTPUT=$(npx wrangler deploy)
          echo "$DEPLOY_OUTPUT"
          WORKER_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*\.workers\.dev' | head -n 1)
          if [ -n "$WORKER_URL" ]; then
            echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
            echo "=========================================================="
            echo "WORKER DEPLOYED SUCCESSFULLY!"
            echo "Your Worker API URL is: $WORKER_URL"
            echo "Copy this URL into the ShardMail Android Setup / Keys tab."
            echo "=========================================================="
          fi

      - name: Verify Health Endpoint
        if: steps.deploy.outputs.worker_url != ''
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}/health"
          echo "Testing health endpoint: $URL"
          curl -f -s "$URL" || echo "Health check returned non-200 or pending propagation"
