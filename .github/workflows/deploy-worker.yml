name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker & D1 Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Setting up D1 database..."
          npx wrangler d1 create shardmail-db || true
          npx wrangler d1 migrations apply shardmail-db --remote

      - name: Configure Admin Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN
          else
            echo "::warning::ADMIN_TOKEN secret not set in repository settings"
          fi

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOY_OUTPUT=$(npx wrangler deploy)
          echo "$DEPLOY_OUTPUT"
          WORKER_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*\.workers\.dev' | head -n 1)
          if [ -n "$WORKER_URL" ]; then
            echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
            echo "=========================================================="
            echo "WORKER DEPLOYED SUCCESSFULLY!"
            echo "Your Worker API URL is: $WORKER_URL"
            echo "Copy this URL into the ShardMail Android Setup / Keys tab."
            echo "=========================================================="
          fi

      - name: Verify Health Endpoint
        if: steps.deploy.outputs.worker_url != ''
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}/health"
          echo "Testing health endpoint: $URL"
          curl -f -s "$URL" || echo "Health check returned non-200 or pending propagation"
